  /api/integrations/directory-sync/runs/{id}:
    get:
      tags: [企微目录同步]
      operationId: 查询企微同步批次详情
      summary: 查询单个同步批次
      parameters: [{ $ref: "#/components/parameters/同步批次编号" }]
      responses:
        "200": { $ref: "#/components/responses/通用成功" }
        "400": { $ref: "#/components/responses/企微请求不合法" }
        "401": { $ref: "#/components/responses/企微未登录" }
        "403": { $ref: "#/components/responses/企微无权限" }
        "404": { $ref: "#/components/responses/组织不存在" }
        "503": { $ref: "#/components/responses/企微功能关闭" }
  /api/integrations/directory-sync/changes:
    get:
      tags: [企微目录同步]
      operationId: 查询企微同步差异
      summary: 分页查询同步差异
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: runId, in: query, schema: { $ref: "#/components/schemas/UUID" } }
        - { name: riskLevel, in: query, schema: { enum: [low, medium, high] } }
        - { name: approvalStatus, in: query, schema: { enum: [pending, approved, rejected] } }
      responses:
        "200": { $ref: "#/components/responses/分页成功" }
        "400": { $ref: "#/components/responses/企微请求不合法" }
        "401": { $ref: "#/components/responses/企微未登录" }
        "403": { $ref: "#/components/responses/企微无权限" }
        "503": { $ref: "#/components/responses/企微功能关闭" }
  /api/integrations/directory-sync/runs/{id}/apply:
    post:
      tags: [企微目录同步]
      operationId: 禁止应用企微同步差异
      summary: 固定拒绝企微同步应用
      description: 当前版本没有审批应用能力。无论提交何种已审批差异或行版本，均返回 DIRECTORY_SYNC_APPLY_DISABLED；不得以此接口改写任何业务主体。
      parameters: [{ $ref: "#/components/parameters/同步批次编号" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/禁止的同步应用请求" }
      responses:
        "409": { $ref: "#/components/responses/企微应用已禁止" }
        "400": { $ref: "#/components/responses/企微请求不合法" }
        "401": { $ref: "#/components/responses/企微未登录" }
        "403": { $ref: "#/components/responses/企微无权限" }
        "503": { $ref: "#/components/responses/企微功能关闭" }
  /api/integrations/directory-sync/runs/{id}/pause:
    post:
      tags: [企微目录同步]
      operationId: 禁止暂停企微同步应用
      summary: 固定拒绝暂停应用任务
      description: 当前只有只读预览批次，不存在可暂停的应用任务，固定返回 DIRECTORY_SYNC_APPLY_DISABLED。
      parameters: [{ $ref: "#/components/parameters/同步批次编号" }]
      responses:
        "409": { $ref: "#/components/responses/企微应用已禁止" }
        "400": { $ref: "#/components/responses/企微请求不合法" }
        "401": { $ref: "#/components/responses/企微未登录" }
        "403": { $ref: "#/components/responses/企微无权限" }
        "503": { $ref: "#/components/responses/企微功能关闭" }
components:
  securitySchemes:
    V3签名会话:
      type: apiKey
      in: cookie
      name: v3_session
      description: V3 HttpOnly 签名会话 Cookie；具体 Cookie 名称由部署配置维护，客户端不得伪造。
  parameters:
    用户编号:
      name: userId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    候选编号:
      name: candidateId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    组织编号:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    同步批次编号:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    数据范围主体类型:
      name: subjectType
      in: path
      required: true
      schema: { type: string, enum: [role, user] }
    数据范围主体编号:
      name: subjectId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    幂等键:
      name: Idempotency-Key
      in: header
      required: false
      description: 当前已接入组织写入服务的接口支持该键；长度不得超过 200。相同操作、相同主体和相同请求摘要会返回原结果；同键不同摘要返回 ORG_IDEMPOTENCY_CONFLICT。
      schema: { type: string, minLength: 1, maxLength: 200 }
    幂等键必填:
      name: Idempotency-Key
      in: header
      required: true
      description: 企业微信身份映射确认导入必须提供；网络超时重试时必须复用原值。
      schema: { type: string, minLength: 1, maxLength: 200 }
  requestBodies:
    行版本请求:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [rowVersion]
            properties:
              rowVersion: { type: integer, minimum: 1, description: 当前行版本，乐观锁必填。 }
  responses:
    通用成功:
      description: 操作成功，响应 meta 中包含 requestId 和构建信息。
      content: { application/json: { schema: { $ref: "#/components/schemas/通用成功响应" } } }
    列表成功:
      description: 列表读取成功。
      content: { application/json: { schema: { $ref: "#/components/schemas/列表成功响应" } } }
    分页成功:
      description: 分页读取成功。
      content: { application/json: { schema: { $ref: "#/components/schemas/分页成功响应" } } }
    组织树成功:
      description: 组织树读取成功。
      content: { application/json: { schema: { $ref: "#/components/schemas/组织树成功响应" } } }
    外部身份映射成功:
      description: 外部身份映射列表、当前筛选范围统计和分页信息。
      content:
        { application/json: { schema: { $ref: "#/components/schemas/外部身份映射成功响应" } } }
    企业微信身份映射预览成功:
      description: 企业微信身份映射文件已解析并完成只读预览。
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/企业微信身份映射预览成功响应" } },
        }
    企业微信身份映射导入成功:
      description: 企业微信身份映射已在事务内导入并完成审计。
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/企业微信身份映射导入成功响应" } },
        }
    账号冲突清单成功:
      description: 同名不同登录账号清单读取成功。
      content:
        { application/json: { schema: { $ref: "#/components/schemas/账号冲突清单成功响应" } } }
    企业微信身份校正成功:
      description: 企业微信身份映射已受控校正并完成审计。
      content:
        { application/json: { schema: { $ref: "#/components/schemas/企业微信身份校正成功响应" } } }
    企微状态成功:
      description: 企微同步状态读取成功。
      content: { application/json: { schema: { $ref: "#/components/schemas/企微状态成功响应" } } }
    离职影响预览成功:
      description: 离职影响、候选接收人和唯一推荐接收人读取成功。
      content:
        { application/json: { schema: { $ref: "#/components/schemas/离职影响预览成功响应" } } }
    组织未登录:
      description: ORG_AUTH_REQUIRED、V3_AUTH_ACCOUNT_DISABLED、V3_AUTH_ACCOUNT_UNAVAILABLE 或 V3_AUTH_SESSION_MISMATCH
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    组织无权限:
      description: ORG_PERMISSION_DENIED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    组织写入关闭:
      description: ORG_WRITE_DISABLED 或 ORG_PERMISSION_DENIED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    组织功能关闭:
      description: ORG_FEATURE_DISABLED 或 V3_AUTH_ACCOUNT_CHECK_UNAVAILABLE
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    组织请求不合法:
      description: ORG_REQUEST_INVALID 或 ORG_IDEMPOTENCY_KEY_INVALID
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    企业微信身份映射请求不合法:
      description: ORG_WECOM_IMPORT_FILE_MISSING、ORG_WECOM_IMPORT_FILE_TYPE_INVALID、ORG_WECOM_IMPORT_FILE_EMPTY、ORG_WECOM_IMPORT_FILE_PARSE_FAILED、ORG_WECOM_IMPORT_HEADER_MISSING、ORG_WECOM_IMPORT_HEADER_INVALID、ORG_WECOM_IMPORT_ROW_EMPTY、ORG_WECOM_IMPORT_ROW_LIMIT_EXCEEDED、ORG_WECOM_IMPORT_UPLOAD_FAILED 或 ORG_IDEMPOTENCY_KEY_REQUIRED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    组织不存在:
      description: ORG_NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    组织并发或约束冲突:
      description: ORG_VERSION_CONFLICT、ORG_CONFLICT、ORG_IDEMPOTENCY_CONFLICT 或 ORG_IDEMPOTENCY_PROCESSING
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    企业微信身份映射冲突:
      description: ORG_WECOM_IMPORT_BLOCKED、ORG_WECOM_IMPORT_NOTHING_TO_IMPORT、ORG_CONFLICT、ORG_IDEMPOTENCY_CONFLICT 或 ORG_IDEMPOTENCY_PROCESSING
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    组织物理删除禁止:
      description: ORG_PHYSICAL_DELETE_DISABLED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    离职交接关闭:
      description: ORG_OFFBOARDING_DISABLED、ORG_WRITE_DISABLED 或 ORG_PERMISSION_DENIED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    数据范围用户覆盖关闭:
      description: DATA_SCOPE_USER_OVERRIDE_DISABLED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    离职交接不可关闭:
      description: ORG_OFFBOARDING_NOT_READY、ORG_OFFBOARDING_ITEMS_PENDING 或 ORG_VERSION_CONFLICT
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    企微未登录:
      description: DIRECTORY_SYNC_AUTH_REQUIRED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    企微无权限:
      description: DIRECTORY_SYNC_PERMISSION_DENIED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    企微功能关闭:
      description: DIRECTORY_SYNC_ORGANIZATION_DISABLED 或 DIRECTORY_SYNC_FEATURE_DISABLED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    企微请求不合法:
      description: DIRECTORY_SYNC_REQUEST_INVALID
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
    企微应用已禁止:
      description: DIRECTORY_SYNC_APPLY_DISABLED
      content: { application/json: { schema: { $ref: "#/components/schemas/错误响应" } } }
  schemas:
    UUID: { type: string, format: uuid }
    通用成功响应:
      type: object
      required: [success, data, meta]
      properties:
        success: { const: true }
        data: { type: object, additionalProperties: true }
        meta:
          type: object
          required: [requestId, build]
          properties:
            requestId: { type: string }
            build: { type: object, additionalProperties: true }
    列表成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                { items: { type: array, items: { type: object, additionalProperties: true } } }
    分页成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [items, page, pageSize, total]
              properties:
                items: { type: array, items: { type: object, additionalProperties: true } }
                page: { type: integer, minimum: 1 }
                pageSize: { type: integer, minimum: 1 }
                total: { type: integer, minimum: 0 }
    账号恢复预览成功:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  user,
                  readOnly,
                  canReactivate,
                  previousRoles,
                  externalIdentities,
                  externalIdentityPolicy,
                ]
              properties:
                user: { type: object, additionalProperties: true }
                readOnly: { const: true }
                canReactivate: { type: boolean }
                previousRoles: { type: array, items: { type: object, additionalProperties: true } }
                externalIdentities:
                  { type: array, items: { type: object, additionalProperties: true } }
                externalIdentityPolicy: { const: retain_no_transfer }
                notice: { type: string }
    账号归并预览成功:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  sourceUser,
                  keepUser,
                  readOnly,
                  canMerge,
                  totalCount,
                  items,
                  externalIdentities,
                  externalIdentityPolicy,
                ]
              properties:
                sourceUser: { type: object, additionalProperties: true }
                keepUser: { type: object, additionalProperties: true }
                readOnly: { const: true }
                canMerge: { type: boolean }
                eligibleRecipient: { type: boolean }
                totalCount: { type: integer, minimum: 0 }
                items: { type: array, items: { type: object, additionalProperties: true } }
                externalIdentities:
                  { type: array, items: { type: object, additionalProperties: true } }
                externalIdentityPolicy: { const: retain_no_transfer }
                notice: { type: string }
    组织状态成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  enabled,
                  writeEnabled,
                  channelPhoneEditEnabled,
                  directorySyncEnabled,
                  accountEntryMerged,
                  accountStatusCheckEnabled,
                  offboardingEnabled,
                ]
              properties:
                enabled: { type: boolean }
                writeEnabled: { type: boolean }
                channelPhoneEditEnabled:
                  type: boolean
                  description: 是否允许修改渠道成员手机号；IAM/UniSDP 手机号匹配专项回归前必须关闭。
                directorySyncEnabled: { type: boolean }
                accountEntryMerged:
                  type: boolean
                  description: 是否启用“组织与账号”导航；不改变登录、会话或接口授权。
                accountStatusCheckEnabled:
                  type: boolean
                  description: 是否持续校验账号状态并拒绝停用账号的旧会话；执行交接前必须开启，回退交接时不得关闭。
                offboardingEnabled:
                  type: boolean
                  description: 是否允许发起、重试和关闭停用归档交接；关闭时仍允许只读影响预览。
    离职影响预览成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  user,
                  readOnly,
                  totalCount,
                  requiresReplacement,
                  recommendedReplacementUserId,
                  candidates,
                  items,
                ]
              properties:
                user: { type: object, additionalProperties: true }
                readOnly: { const: true }
                totalCount: { type: integer, minimum: 0 }
                requiresReplacement: { type: boolean }
                recommendedReplacementUserId:
                  oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }]
                candidates:
                  type: array
                  items:
                    type: object
                    required: [id, username, displayName, roleCodes]
                    properties:
                      id: { $ref: "#/components/schemas/UUID" }
                      username: { type: string }
                      displayName: { type: string }
                      regionId:
                        oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }]
                      regionName:
                        oneOf: [{ type: string }, { type: "null" }]
                      roleCodes: { type: array, items: { type: string } }
                items: { type: array, items: { type: object, additionalProperties: true } }
    组织树成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/组织单元" } }
    外部身份映射成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [items, summary, pagination]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      [
                        userId,
                        username,
                        displayName,
                        statusCode,
                        roleCodes,
                        roleNames,
                        eteams,
                        wecom,
                      ]
                    properties:
                      userId: { $ref: "#/components/schemas/UUID" }
                      username: { type: string }
                      displayName: { type: string }
                      statusCode: { type: string, enum: [active, disabled, locked] }
                      regionId: { oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }] }
                      regionName: { oneOf: [{ type: string }, { type: "null" }] }
                      roleCodes: { type: array, items: { type: string } }
                      roleNames: { type: array, items: { type: string } }
                      eteams: { $ref: "#/components/schemas/外部身份状态" }
                      eteamsCandidate:
                        oneOf: [{ $ref: "#/components/schemas/泛微候选身份状态" }, { type: "null" }]
                      wecom: { $ref: "#/components/schemas/外部身份状态" }
                summary:
                  type: object
                  required:
                    [
                      total,
                      eteamsActive,
                      eteamsMissing,
                      eteamsPending,
                      wecomActive,
                      wecomMissing,
                      abnormal,
                    ]
                  properties:
                    total: { type: integer, minimum: 0 }
                    eteamsActive: { type: integer, minimum: 0 }
                    eteamsMissing: { type: integer, minimum: 0 }
                    eteamsPending: { type: integer, minimum: 0 }
                    wecomActive: { type: integer, minimum: 0 }
                    wecomMissing: { type: integer, minimum: 0 }
                    abnormal: { type: integer, minimum: 0 }
                pagination:
                  type: object
                  required: [page, pageSize, total]
                  properties:
                    page: { type: integer, minimum: 1 }
                    pageSize: { type: integer, minimum: 1, maximum: 100 }
                    total: { type: integer, minimum: 0 }
    外部身份状态:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, pending, disabled, missing, duplicate] }
        externalSubject: { oneOf: [{ type: string }, { type: "null" }] }
        externalUsername: { oneOf: [{ type: string }, { type: "null" }] }
        updatedAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        rowVersion: { oneOf: [{ type: integer }, { type: "null" }] }
    泛微候选身份状态:
      type: object
      required: [status]
      properties:
        status: { const: pending }
        externalSubject: { oneOf: [{ type: string }, { type: "null" }] }
        externalUsername: { oneOf: [{ type: string }, { type: "null" }] }
    企微状态成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [enabled, applyEnabled, mode]
              properties:
                enabled: { type: boolean }
                applyEnabled: { const: false, description: 当前版本固定为 false。 }
                mode: { type: string, enum: [disabled, readonly_preview] }
    企业微信身份映射文件上传:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: UTF-8 CSV 或 XLSX 文件，最大 5MB，表头必须为“姓名”和“账号”。账号列为企业微信 UserId。
    企业微信身份映射预览成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [fileName, sourceSha256, rows, summary, canConfirm]
              properties:
                fileName: { type: string }
                sourceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                rows:
                  type: array
                  items: { $ref: "#/components/schemas/企业微信身份映射预览行" }
                summary: { $ref: "#/components/schemas/企业微信身份映射汇总" }
                canConfirm: { type: boolean }
    企业微信身份映射导入成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [imported, unchanged, waitingForUser, blocked, sourceSha256, identities]
              properties:
                imported: { type: integer, minimum: 0 }
                unchanged: { type: integer, minimum: 0 }
                waitingForUser: { type: integer, minimum: 0 }
                blocked: { const: 0 }
                sourceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                identities:
                  type: array
                  items:
                    type: object
                    required: [id, userId, username, displayName, wecomUserId, rowNumber]
                    properties:
                      id: { $ref: "#/components/schemas/UUID" }
                      userId: { $ref: "#/components/schemas/UUID" }
                      username: { type: string }
                      displayName: { type: string }
                      wecomUserId: { type: string }
                      rowNumber: { type: integer, minimum: 2 }
    企业微信身份映射预览行:
      type: object
      required: [rowNumber, displayName, wecomUserId, status, message]
      properties:
        rowNumber: { type: integer, minimum: 2 }
        displayName: { type: string }
        wecomUserId: { type: string }
        status: { type: string, enum: [ready, unchanged, waiting_for_user, blocked] }
        message: { type: string }
        user:
          type: object
          properties:
            id: { $ref: "#/components/schemas/UUID" }
            username: { type: string }
            displayName: { type: string }
        conflict:
          $ref: "#/components/schemas/企业微信身份映射冲突详情"
    企业微信身份映射冲突详情:
      type: object
      properties:
        action: { type: string, enum: [edit_file, open_accounts, correct_identity] }
        users:
          type: array
          items: { $ref: "#/components/schemas/企业微信身份关联账号" }
        identities:
          type: array
          items: { $ref: "#/components/schemas/企业微信身份关联映射" }
    企业微信身份关联账号:
      type: object
      required: [id, username, displayName, statusCode]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        username: { type: string }
        displayName: { type: string }
        statusCode: { type: string, enum: [active, disabled, locked] }
    企业微信身份关联映射:
      type: object
      required: [id, userId, username, displayName, externalSubject, statusCode, rowVersion]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        userId: { $ref: "#/components/schemas/UUID" }
        username: { type: string }
        displayName: { type: string }
        externalSubject: { type: string }
        statusCode: { type: string, enum: [active, disabled] }
        rowVersion: { type: integer, minimum: 1 }
    企业微信身份校正请求:
      type: object
      required: [targetUserId, wecomUserId, expectedIdentities, reason, confirmationUsername]
      properties:
        targetUserId: { $ref: "#/components/schemas/UUID" }
        wecomUserId: { type: string, minLength: 1, maxLength: 128 }
        expectedIdentities:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            required: [identityId, rowVersion]
            properties:
              identityId: { $ref: "#/components/schemas/UUID" }
              rowVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 200 }
        confirmationUsername: { type: string, minLength: 1, maxLength: 200 }
    企业微信身份校正成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [targetUserId, wecomUserId, disabledIdentities, activeIdentity]
              properties:
                targetUserId: { $ref: "#/components/schemas/UUID" }
                wecomUserId: { type: string }
                disabledIdentities:
                  type: array
                  items: { $ref: "#/components/schemas/企业微信身份关联映射" }
                activeIdentity: { $ref: "#/components/schemas/企业微信身份关联映射" }
    账号冲突清单成功响应:
      allOf:
        - $ref: "#/components/schemas/通用成功响应"
        - type: object
          properties:
            data:
              type: object
              required: [sameDisplayNameGroups]
              properties:
                sameDisplayNameGroups:
                  type: array
                  items:
                    type: object
                    required: [displayName, users]
                    properties:
                      displayName: { type: string }
                      users:
                        type: array
                        minItems: 2
                        items: { $ref: "#/components/schemas/企业微信身份关联账号" }
    企业微信身份映射汇总:
      type: object
      required: [total, ready, unchanged, waitingForUser, blocked]
      properties:
        total: { type: integer, minimum: 0 }
        ready: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        waitingForUser: { type: integer, minimum: 0 }
        blocked: { type: integer, minimum: 0 }
    错误响应:
      type: object
      required: [success, error, meta]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string, description: 中文可读错误消息。 }
        meta:
          type: object
          required: [requestId, build]
          properties:
            requestId: { type: string }
            build: { type: object, additionalProperties: true }
    组织单元:
      type: object
      required: [id, unitCode, unitName, unitType, statusCode, sortOrder, rowVersion]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        unitCode: { type: string }
        unitName: { type: string }
        unitType: { type: string }
        parentUnitId: { oneOf: [{ $ref: "#/components/schemas/UUID" }, { type: "null" }] }
        statusCode: { type: string, enum: [draft, active, disabled, archived] }
        sortOrder: { type: integer }
        rowVersion: { type: integer, minimum: 1 }
        children: { type: array, items: { $ref: "#/components/schemas/组织单元" } }
    创建组织请求:
      type: object
      required: [unitCode, unitName, unitType]
      properties:
        unitCode: { type: string, minLength: 1 }
        unitName: { type: string, minLength: 1 }
        unitType:
          {
            type: string,
            enum:
              [
                headquarters,
                division,
                big_region,
                region,
                province,
                city,
                department,
                team,
                channel_company,
                channel_department,
                channel_team,
              ],
          }
        parentUnitId: { $ref: "#/components/schemas/UUID" }
        sortOrder: { type: integer, default: 0 }
    更新组织请求:
      allOf:
        - $ref: "#/components/schemas/创建组织请求"
        - type: object
          required: [rowVersion]
          properties: { rowVersion: { type: integer, minimum: 1 } }
    状态更新请求:
      type: object
      required: [statusCode, rowVersion]
      properties:
        statusCode: { type: string, enum: [draft, active, disabled, archived] }
        rowVersion: { type: integer, minimum: 1 }
    创建岗位请求:
      type: object
      required: [orgUnitId, positionCode, positionName]
      properties:
        orgUnitId: { $ref: "#/components/schemas/UUID" }
        positionCode: { type: string, minLength: 1 }
        positionName: { type: string, minLength: 1 }
        category:
          { type: string, enum: [management, sales, support, functional, other], default: other }
    更新岗位请求:
      type: object
      required: [positionName, category, rowVersion]
      properties:
        positionName: { type: string, minLength: 1 }
        category: { type: string, enum: [management, sales, support, functional, other] }
        rowVersion: { type: integer, minimum: 1 }
    创建任职请求:
      type: object
      required: [orgUnitId]
      properties:
        orgUnitId: { $ref: "#/components/schemas/UUID" }
        positionId: { $ref: "#/components/schemas/UUID" }
        isPrimary:
          type: boolean
          enum: [true]
          default: true
          description: 兼容字段；当前唯一有效任职始终为主职。
    更新任职请求:
      allOf:
        - $ref: "#/components/schemas/创建任职请求"
        - type: object
          required: [rowVersion]

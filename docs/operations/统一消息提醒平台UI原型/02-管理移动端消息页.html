<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>统一消息提醒平台管理移动端原型</title>
    <style>
      :root { --blue:#2563c7; --ink:#24364d; --muted:#718198; --line:#e7ecf4; --bg:#f5f7fb; --white:#fff; --danger:#df4b56; --warning:#e18a18; --success:#24a36b; --purple:#7465d6; }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#e6ebf3; color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
      .phone { width:390px; min-height:844px; margin:0 auto; overflow:hidden; position:relative; background:var(--bg); box-shadow:0 12px 36px rgba(36,54,77,.16); }
      .safe { height:28px; background:var(--white); } .head { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--white); border-bottom:1px solid var(--line); }
      .back,.more { width:44px; height:44px; display:grid; place-items:center; color:var(--ink); font-size:22px; } .head h1 { margin:0; font-size:18px; letter-spacing:.2px; }
      .profile { display:flex; gap:12px; align-items:center; padding:16px 18px 14px; background:var(--white); } .avatar { width:40px; height:40px; display:grid; place-items:center; border-radius:14px; color:#fff; background:linear-gradient(135deg,#2b70d1,#7b66d9); font-weight:700; }
      .profile strong { display:block; font-size:14px; } .profile span { color:var(--muted); font-size:12px; }
      .tabs { display:flex; gap:7px; padding:14px 16px 10px; overflow:hidden; background:var(--white); } .tab { flex:1; min-width:72px; height:34px; display:grid; place-items:center; border:1px solid var(--line); border-radius:18px; color:var(--muted); font-size:13px; } .tab.active { border-color:#d3e2fc; color:var(--blue); background:#edf4ff; font-weight:700; }
      .filters { height:52px; display:flex; justify-content:space-between; align-items:center; padding:0 18px; border-top:1px solid var(--line); background:var(--white); color:var(--muted); font-size:12px; } .switch { display:flex; gap:7px; align-items:center; color:var(--ink); } .dot { width:8px; height:8px; border-radius:50%; background:var(--blue); }
      .list { padding:10px 12px 100px; } .date { margin:12px 6px 8px; color:#90a0b4; font-size:12px; }
      .item { display:grid; grid-template-columns:10px 1fr; gap:10px; margin-bottom:10px; padding:14px; border:1px solid var(--line); border-radius:16px; background:var(--white); box-shadow:0 1px 3px rgba(30,47,73,.03); } .unread { background:#fafdff; border-color:#dbeafe; } .unread .point { background:var(--blue); } .point { width:6px; height:6px; margin-top:8px; border-radius:50%; background:transparent; }
      .row { display:flex; align-items:center; gap:7px; } .tag { padding:2px 7px; border-radius:10px; font-size:11px; font-weight:650; } .todo { color:#245fae; background:#e8f2ff; } .system { color:#5f51b7; background:#efedff; } .business { color:#9c6209; background:#fff2dc; }
      .title { font-weight:700; font-size:15px; } .desc { margin-top:5px; color:var(--muted); font-size:13px; } .meta { display:flex; justify-content:space-between; align-items:center; margin-top:10px; color:#9aa8ba; font-size:12px; } .link { color:var(--blue); font-weight:700; }
      .bottom { position:absolute; right:0; bottom:0; left:0; height:82px; display:flex; justify-content:space-around; padding-top:10px; border-top:1px solid var(--line); background:rgba(255,255,255,.97); } .nav { min-width:60px; color:#8b9aae; font-size:11px; text-align:center; } .nav i { display:block; height:26px; color:inherit; font-size:20px; font-style:normal; } .nav.active { color:var(--blue); font-weight:700; }
      .annotation { position:absolute; top:8px; right:8px; padding:4px 7px; border-radius:7px; color:#fff; background:rgba(36,54,77,.7); font-size:10px; }
    </style>
  </head>
  <body>
    <main class="phone">
      <div class="safe"></div><header class="head"><span class="back">‹</span><h1>消息通知</h1><span class="more">···</span></header>
      <section class="profile"><span class="avatar">李</span><div><strong>李明</strong><span>区域管理员 · 当前共 8 条未读</span></div></section>
      <nav class="tabs"><span class="tab active">全部 8</span><span class="tab">待办 3</span><span class="tab">提醒 4</span><span class="tab">系统 1</span></nav>
      <div class="filters"><span class="switch"><span class="dot"></span>仅看未读</span><span>最近 30 天⌄</span></div>
      <section class="list">
        <div class="date">今天</div>
        <article class="item unread"><span class="point"></span><div><div class="row"><span class="tag todo">待办</span><span class="title">待确认订单</span></div><div class="desc">订单 DD20260814001 等待您处理，请在规定时间内完成确认。</div><div class="meta"><span>2 分钟前</span><span class="link">去处理 ›</span></div></div></article>
        <article class="item unread"><span class="point"></span><div><div class="row"><span class="tag system">系统</span><span class="title">任务处理异常</span></div><div class="desc">数据同步任务连续失败，已按规则通知管理员处理。</div><div class="meta"><span>今天 10:12</span><span class="link">查看详情 ›</span></div></div></article>
        <article class="item unread"><span class="point"></span><div><div class="row"><span class="tag business">提醒</span><span class="title">合同即将到期</span></div><div class="desc">合同 HT20250087 将在 7 天后到期，请核对续签计划。</div><div class="meta"><span>今天 09:30</span><span class="link">查看 ›</span></div></div></article>
        <div class="date">昨天</div>
        <article class="item"><span class="point"></span><div><div class="row"><span class="tag system">系统</span><span class="title">数据同步任务已完成</span></div><div class="desc">本次同步完成，未发现需要人工处理的异常。</div><div class="meta"><span>昨天 16:42</span><span>已读</span></div></div></article>
      </section>
      <footer class="bottom"><span class="nav"><i>⌂</i>首页</span><span class="nav"><i>◎</i>业务</span><span class="nav active"><i>♧</i>消息</span><span class="nav"><i>◌</i>我的</span></footer><span class="annotation">管理移动端原型</span>
    </main>
  </body>
</html>

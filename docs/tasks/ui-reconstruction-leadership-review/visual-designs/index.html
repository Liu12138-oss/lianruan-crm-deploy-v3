    <link rel="stylesheet" href="assets/visual-ui.css" />
    <style>
      .gallery { width: min(100% - 64px, 1320px); margin: 0 auto; padding: 42px 0 72px; }

      .gallery-card:hover { transform: translateY(-4px); box-shadow: 0 24px 56px rgba(35, 76, 123, .16); }
      .gallery-card img { display: block; width: 100%; height: 230px; object-fit: cover; object-position: top center; }

      .gallery-card-body p { min-height: 45px; margin: 0 0 14px; color: var(--text-3); font-size: 12px; }
      .gallery-link { color: var(--blue-strong); font-size: 12px; font-weight: 800; }
      @media (max-width: 960px) { .gallery-grid { grid-template-columns: 1fr; } .gallery { width: min(100% - 28px, 1320px); } }

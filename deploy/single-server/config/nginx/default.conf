upstream v3_api {
    server api-1:3100 max_fails=3 fail_timeout=10s;
    server api-2:3100 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;
    client_body_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /health/dependencies {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://v3_api/health/dependencies;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://v3_api/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://v3_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app/sso.htm {
        proxy_pass http://v3_api/app/sso.htm;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容 SDP 网关的 /<32位应用ID>/... 代理前缀。该前缀不属于 CRM 路由，
    # 统一回收到同源入口，避免前端把网关前缀误判为 404 页面。
    location ~ "^/[0-9a-fA-F]{32}(/|$)" {
        absolute_redirect off;
        return 302 /$is_args$args;
    }

    # 旧 SDP 门户入口不在本机提供，保留旧书签可用性并转到正式门户，
    # 避免 /UniSSOView/ 被下方单页应用兜底规则接管后显示前端 404。
    location = /UniSSOView {
        return 302 https://portal.leagsoft.com/UniSSOView/;
    }

    # 门户前端使用 hash 路由，旧登录深链需归一化为 #/login。
    location = /UniSSOView/login {
        return 302 https://portal.leagsoft.com/UniSSOView/#/login$is_args$args;
    }

    location = /UniSSOView/login/ {
        return 302 https://portal.leagsoft.com/UniSSOView/#/login$is_args$args;
    }

    location ^~ /UniSSOView/ {
        return 302 https://portal.leagsoft.com$request_uri;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 统一入口：旧桌面入口一律重定向到重构后的正式路由，避免用户停留在旧版页面
    location = /login.html {
        return 301 /login;
    }

    location = /admin.html {
        return 301 /admin;
    }

    location = /partner.html {
        return 301 /partner;
    }

    location = /login {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /login/singlesignonlogin/login.do {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /sso/iam {
        # 手机端单点登录使用轻量静态页，避免下载完整桌面应用后长时间白屏。
        if ($http_user_agent ~* "(iPhone|iPad|iPod|Android|Mobile|EMMSafeBrowser)") {
            rewrite ^ /sso-mobile.html last;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /sso/unisdp {
        if ($http_user_agent ~* "(iPhone|iPad|iPod|Android|Mobile|EMMSafeBrowser)") {
            rewrite ^ /sso-mobile.html last;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /admin {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /admin/ {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /partner {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /partner/ {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}

services:
  nginx:
    image: lianruan-crm-v3-nginx:${V3_IMAGE_TAG:-3.0.0-alpha.1}
    container_name: lianruan-crm-v3-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/logs/nginx:/var/log/nginx
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-1:
    image: lianruan-crm-v3-api:${V3_IMAGE_TAG:-3.0.0-alpha.1}
    container_name: lianruan-crm-v3-api-1
    restart: unless-stopped
    env_file:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/config/v3.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3100
    volumes:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/uploads:/app/uploads
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/exports:/app/exports
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/logs/api-1:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis-state:
        condition: service_healthy
    expose:
      - "3100"
    networks:
      - app_net
      - data_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3100/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api-2:
    image: lianruan-crm-v3-api:${V3_IMAGE_TAG:-3.0.0-alpha.1}
    container_name: lianruan-crm-v3-api-2
    restart: unless-stopped
    env_file:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/config/v3.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3100
    volumes:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/uploads:/app/uploads
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/exports:/app/exports
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/logs/api-2:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis-state:
        condition: service_healthy
    expose:
      - "3100"
    networks:
      - app_net
      - data_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3100/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    image: lianruan-crm-v3-worker:${V3_IMAGE_TAG:-3.0.0-alpha.1}
    container_name: lianruan-crm-v3-worker
    restart: unless-stopped
    env_file:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/config/v3.env
    volumes:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/uploads:/app/uploads
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/exports:/app/exports
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/migration:/app/migration
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/logs/worker:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis-state:
        condition: service_healthy
    networks:
      - data_net

  postgres:
    image: postgres:16.4-alpine
    container_name: lianruan-crm-v3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lianruan_crm_v3
      POSTGRES_USER: lianruan_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Shanghai
    secrets:
      - postgres_password
    volumes:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/postgres:/var/lib/postgresql/data
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/logs/postgres:/var/log/postgresql
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lianruan_app -d lianruan_crm_v3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis-state:
    image: redis:7.2.5-alpine
    container_name: lianruan-crm-v3-redis-state
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        redis-server
        --appendonly yes
        --save 900 1
        --requirepass "$$(cat /run/secrets/redis_password)"
        --maxmemory 3gb
        --maxmemory-policy noeviction
    secrets:
      - redis_password
    volumes:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/redis-state:/data
    networks:
      - data_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis-cache:
    image: redis:7.2.5-alpine
    container_name: lianruan-crm-v3-redis-cache
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        redis-server
        --appendonly yes
        --save 900 1
        --requirepass "$$(cat /run/secrets/redis_password)"
        --maxmemory 2gb
        --maxmemory-policy allkeys-lru
    secrets:
      - redis_password
    volumes:
      - ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/data/redis-cache:/data
    networks:
      - data_net

secrets:
  postgres_password:
    file: ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/secrets/postgres_password
  redis_password:
    file: ${INSTALL_ROOT:-/opt/lianruan-crm-v3}/secrets/redis_password

networks:
  app_net:
    name: lianruan-crm-v3-app
  data_net:
    name: lianruan-crm-v3-data
    internal: true
